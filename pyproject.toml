[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openminion-repo-sentinel"
version = "0.1.0"
description = "Repeatable Git release readiness & secret-leak triage agent built on the OpenMinion 0.1 Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openminion>=0.1.24,<0.2.0",
    "pydantic>=2.0.0",
]

[project.scripts]
repo-sentinel = "sentinel.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
